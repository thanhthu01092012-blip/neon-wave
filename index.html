```html
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Neon Wave</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="gameContainer">

        <canvas id="gameCanvas"></canvas>

        <!-- MENU -->
        <div id="menu" class="screen">
            <div class="panel">
                <div class="small-title">WELCOME TO</div>
                <h1>NEON WAVE</h1>

                <p class="description">
                    Bay qua không gian neon và tránh mọi chướng ngại vật!
                </p>

                <button id="playButton">PLAY</button>

                <div class="controls">
                    <p><b>SPACE</b> / GIỮ CHUỘT</p>
                    <p>Giữ để bay lên • Thả để rơi</p>
                </div>
            </div>
        </div>

        <!-- GAME OVER -->
        <div id="gameOver" class="screen hidden">
            <div class="panel">
                <div class="small-title">GAME OVER</div>

                <h2 id="finalScore">0</h2>
                <p>Điểm</p>

                <button id="restartButton">CHƠI LẠI</button>

                <button id="menuButton" class="secondary">
                    MENU
                </button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">

            <div class="score">
                SCORE: <span id="score">0</span>
            </div>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <button id="pauseButton">Ⅱ</button>

        </div>

        <!-- PAUSE -->
        <div id="pauseScreen" class="screen hidden">
            <div class="panel">
                <h2>PAUSED</h2>

                <button id="resumeButton">
                    TIẾP TỤC
                </button>

                <button id="pauseMenuButton" class="secondary">
                    MENU
                </button>
            </div>
        </div>

    </div>

    <script src="game.js"></script>

</body>
</html>
```
